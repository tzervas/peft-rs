# Fleet standard CI — self-hosted. Honest status on trunk via Actions badge.
# Product Test Suite runs on GitHub-hosted (ci.yml) because self-hosted hosts
# SIGKILL candle-core compiles under memory pressure. fleet-ci still exercises
# the self-hosted path with extreme rustc memory limits.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimize peak RSS on constrained self-hosted / podman cgroup runners.
  # CARGO_BUILD_JOBS=1 serializes crate graph builds (and feeds rustc jobserver).
  # High codegen-units + jobs=1: many small CGUs processed one-at-a-time → lower
  # peak RSS than codegen-units=1 (one giant LLVM unit), which SIGKILL'd syn and
  # candle-core on trunk (jobs 89082681557 / 89086942622).
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman]
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          if [ -f Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    # Serialize heavy rustc across branches so concurrent PRs do not stack
    # candle-core compiles on the same memory-capped host.
    concurrency:
      group: peft-rs-fleet-rust-compile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: free memory snapshot
        run: free -h || true
      # check lib+bins+tests only — skip benches (criterion) to cut peak deps;
      # product CI (ci.yml) still covers full --all-targets via clippy/bench paths.
      - name: cargo check
        run: cargo check --workspace --tests
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Sync (best-effort)
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups 2>/dev/null || uv sync 2>/dev/null || true
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            uv run pytest -q 2>/dev/null || pytest -q 2>/dev/null || echo "pytest failed or missing — mark job fail" >&2
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
