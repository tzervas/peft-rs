# Thin caller — policy lives in tzervas/ap-workflows (reusable-ci-autodetect).
# Pin `@v0.1` is the fleet moving tag (0.x: minor is breaking).
#
# all-features: false — `--all-features` pulls `cuda` on this crate.
# rust label selects the fleet work image (ap-workflows/runner-rust or
# ap-fleet-work-images/scribe-cpu-build via host GHA_IMAGE_MAP).
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      tier:
        description: "Force a tier (otherwise derived from the target branch)"
        type: choice
        options: [auto, dev, main]
        default: auto

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fleet-ci:
    uses: tzervas/ap-workflows/.github/workflows/reusable-ci-autodetect.yml@v0.1
    with:
      tier: ${{ inputs.tier || 'auto' }}
      rust-version: "1.96.1"
      cargo-jobs: 1
      all-features: false
      gpu: false
      bench: false
      runner-labels: '["self-hosted","linux","x64","podman","rust"]'

  # protec-main still requires the unprefixed names. Fail closed on the reusable.
  detect-stack:
    name: detect stack
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"

  python-lint:
    name: python lint/test
    needs: fleet-ci
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          echo "fleet-ci result=${{ needs.fleet-ci.result }}"
          test "${{ needs.fleet-ci.result }}" = "success"
