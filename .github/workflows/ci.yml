# Centralized CI — calls tzervas/mycelium-workflows for the lint/check/doc gate.
#
# PIN: @v1 is a moving major tag. Minor/patch policy changes arrive automatically;
# a breaking change lands on v2 and this file must opt in.
#
# REQUIRED CONTEXTS ARE PRESERVED BY NAME. This repo's protec-main ruleset
# requires `Format Check`, `Documentation Build` and `Security Audit` (among
# others). A job that `uses:` a reusable workflow does not report under its own
# name alone, so `Format Check`, `Clippy Lint` and `Documentation Build` are now
# thin aggregates over the centralized call — the contexts keep reporting under
# exactly the names the ruleset requires. Same pattern as fleet-ci.yml's `gate`.
#
# `Security Audit` and the `Test Suite` matrix are kept VERBATIM:
#   * the prebuilt-binary cargo-audit step exists specifically to avoid rustup on
#     constrained hosts, and has no reusable equivalent;
#   * the os x rust matrix (ubuntu/macos x stable/nightly) cannot be expressed by
#     a single reusable call, and macOS coverage must not be lost.
#
# RUNNER: ubuntu-latest at BOTH tiers, deliberately NOT the fleet default for
# main. This repo already documents why: "self-hosted fleet hosts OOM (SIGKILL)
# compiling candle-core/pulp even with CARGO_BUILD_JOBS=1. Product gate must be
# reliable." That measurement still stands.
#
# `--document-private-items` is carried across via doc-args — the previous doc
# job used it, so it checks MORE rustdoc warnings than the centralized default.
name: CI

on:
  push:
    branches: [main, dev, testing]
  pull_request:
    branches: [main, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peft-rs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  ci:
    uses: tzervas/mycelium-workflows/.github/workflows/reusable-rust-ci.yml@v1
    with:
      rust-version: stable
      # `check` at dev, `full` at main. The Test Suite matrix below owns test
      # execution, so the dev tier does not run the suite twice.
      depth: >-
        ${{ (github.base_ref || github.ref_name) == 'main' && 'full' || 'check' }}
      runner-labels: '["ubuntu-latest"]'
      doc-args: '--document-private-items'
      # Previously benches ran only on PRs labelled `performance`, so main could
      # merge with stale benchmark evidence. The main tier now runs them to
      # completion on every PR into main; dev just proves they still compile.
      bench: >-
        ${{ (github.base_ref || github.ref_name) == 'main' && 'run' || 'compile' }}

  format-check:
    # Required status-check context. Thin aggregate over the centralized gate,
    # which runs `cargo fmt --all --check`.
    name: Format Check
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          res='${{ needs.ci.result }}'
          echo "centralized gate result: $res"
          [ "$res" = "success" ] || { echo "::error::centralized CI did not pass (result=$res)"; exit 1; }

  clippy-lint:
    name: Clippy Lint
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          res='${{ needs.ci.result }}'
          echo "centralized gate result: $res"
          [ "$res" = "success" ] || { echo "::error::centralized CI did not pass (result=$res)"; exit 1; }

  documentation-build:
    # Required status-check context. The centralized gate runs
    # `cargo doc --workspace --no-deps --document-private-items` with
    # RUSTDOCFLAGS=-D warnings at the main tier.
    name: Documentation Build
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          res='${{ needs.ci.result }}'
          echo "centralized gate result: $res"
          [ "$res" = "success" ] || { echo "::error::centralized CI did not pass (result=$res)"; exit 1; }

  audit:
    # VERBATIM. Prebuilt cargo-audit only — no rustup (avoids OOM on constrained
    # hosts). Required status-check context `Security Audit`.
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit (prebuilt binary)
        run: |
          set -euo pipefail
          ver="0.22.2"
          asset="cargo-audit-x86_64-unknown-linux-gnu-v${ver}.tgz"
          url="https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${ver}/${asset}"
          mkdir -p "${HOME}/.cargo/bin"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar -xz -C "$tmp"
          bin="$(find "$tmp" -type f -name cargo-audit | head -n1)"
          install -m 0755 "$bin" "${HOME}/.cargo/bin/cargo-audit"
          rm -rf "$tmp"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo-audit --version
          cargo-audit audit

  test:
    # VERBATIM. GitHub-hosted runners: the self-hosted fleet OOMs (SIGKILL)
    # compiling candle-core/pulp even with CARGO_BUILD_JOBS=1. The os x rust
    # matrix cannot be expressed by a single reusable call and macOS coverage
    # must not be lost, so this job stays inline.
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --verbose
