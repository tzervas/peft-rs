# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: fleet-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [ ! -f .gitleaks.toml ]; then
            echo "missing .gitleaks.toml — FAIL (config must be applied)" >&2
            exit 1
          fi
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --config .gitleaks.toml --verbose --redact
          elif command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/path:ro" zricethezav/gitleaks:v8.30.1 detect \
              --source=/path --config=/path/.gitleaks.toml --verbose --redact
          elif command -v podman >/dev/null 2>&1; then
            podman run --rm -v "$PWD:/path:ro" docker.io/zricethezav/gitleaks:v8.30.1 detect \
              --source=/path --config=/path/.gitleaks.toml --verbose --redact
          else
            echo "gitleaks not available on runner — FAIL (honest security gate)" >&2
            exit 1
          fi

  trivy-fs:
    name: trivy filesystem (vuln+secret+license)
    runs-on: [self-hosted, linux, x64, podman, rust]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trivy fs
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            echo "trivy missing — advisory skip (continue-on-error)"
            exit 0
          fi
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
