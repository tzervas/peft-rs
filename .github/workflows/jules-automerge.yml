name: jules-automerge
# Event-driven auto-merge for Jules PRs — no cron, no external actor.
# Fires when a check suite completes; merges the PR only if it is a Jules PR,
# is mergeable, and every non-neutral check has concluded success.
#
# Contract notes:
# - §4a: a skipped job is NOT a passing job. Skipped conclusions block merge.
# - §6: only safe once real required checks actually report. Prefer landing
#   fail-closed gates (#32) and product-CI centralization (#42) and reconciling
#   protec-main required contexts before relying on this workflow.
on:
  check_suite:
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge green Jules PRs (fail-closed on skip/missing)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Collect candidate open PRs (from the triggering PR, or all open on suite events).
            let prs = [];
            if (context.payload.pull_request) {
              prs = [context.payload.pull_request];
            } else {
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open' });
              prs = data;
            }

            for (const pr of prs) {
              const head = pr.head.ref || '';
              const login = (pr.user && pr.user.login) || '';
              const isJules = /jules/i.test(head) || /jules|google-labs/i.test(login);
              if (!isJules) continue;

              // Re-fetch for fresh mergeable state.
              const { data: full } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              if (full.draft) continue;
              if (full.mergeable_state === 'dirty' || full.mergeable === false) {
                core.info(`#${pr.number}: not mergeable (${full.mergeable_state}) — skip`);
                continue;
              }

              // Gate on check-runs for the head SHA.
              // HONEST_CI / contract §4a: skipped is NOT success. Neutral stays
              // non-blocking (informational). Zero completed checks means nothing
              // reported — refuse (required context hang is not a green light).
              const { data: runs } = await github.rest.checks.listForRef({
                owner, repo, ref: full.head.sha, per_page: 100,
              });
              const checks = runs.check_runs || [];
              if (checks.length === 0) {
                core.info(`#${pr.number}: zero check runs on head — refuse merge`);
                continue;
              }

              const pending = checks.filter(c => c.status !== 'completed');
              // Block on anything that is not success or neutral.
              const notGreen = checks.filter(c =>
                c.status === 'completed' && !['success', 'neutral'].includes(c.conclusion)
              );
              if (pending.length) {
                core.info(`#${pr.number}: ${pending.length} checks pending`);
                continue;
              }
              if (notGreen.length) {
                const summary = notGreen.map(c => `${c.name}=${c.conclusion}`).join(', ');
                core.info(`#${pr.number}: checks not green (${summary})`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, merge_method: 'squash',
                });
                core.info(`#${pr.number}: MERGED (Jules, all completed checks success/neutral)`);
              } catch (e) {
                core.warning(`#${pr.number}: merge failed — ${e.message}`);
              }
            }
